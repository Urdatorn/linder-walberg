<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Lexikon">
<meta name="theme-color" content="#f6f2e9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17160f" media="(prefers-color-scheme: dark)">
<meta name="description" content="Linder & Walberg, Svenskt-grekiskt lexikon (1862)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="dictionary.css">
<link rel="stylesheet" href="app.css">
<title>Svenskt-grekiskt lexikon</title>
</head>
<body>
<header id="bar">
  <div id="search-row">
    <svg class="glass" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg>
    <input id="q" type="search" placeholder="Sök svenskt eller grekiskt ord" autocomplete="off" autocorrect="off"
           autocapitalize="off" spellcheck="false" enterkeyhint="search" aria-label="Sök">
  </div>
  <div id="title-row" hidden>
    <button id="back" type="button" aria-label="Tillbaka">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5 8 12l7 7"/></svg>
    </button>
    <span id="bar-title"></span>
    <button id="star" type="button" aria-label="Lägg till i favoriter" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5l2.6 5.6 6.1.7-4.5 4.2 1.2 6L12 17l-5.4 3 1.2-6L3.3 9.8l6.1-.7z"/></svg>
    </button>
  </div>
</header>

<main id="view" tabindex="-1"></main>

<nav id="tabs" aria-label="Flikar">
  <a href="#" data-tab="sok">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg>
    <span>Sök</span></a>
  <a href="#fav" data-tab="fav">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5l2.6 5.6 6.1.7-4.5 4.2 1.2 6L12 17l-5.4 3 1.2-6L3.3 9.8l6.1-.7z"/></svg>
    <span>Favoriter</span></a>
  <a href="#dag" data-tab="dag">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
    <span>Dagens ord</span></a>
  <a href="#partes" data-tab="partes">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6.5h11M9 12h11M9 17.5h11"/><circle cx="4.8" cy="6.5" r=".8"/><circle cx="4.8" cy="12" r=".8"/><circle cx="4.8" cy="17.5" r=".8"/></svg>
    <span>Partes orationis</span></a>
  <a href="#om" data-tab="om">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 11v6"/><circle cx="12" cy="7.8" r=".6"/></svg>
    <span>Om</span></a>
</nav>

<script src="sync.js"></script>
<script src="app.js"></script>
</body>
</html>
